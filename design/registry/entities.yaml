# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: session_escalation
    status: active
    source: design/gdd/floor-plan-system.md
    referenced_by:
      - design/gdd/floor-plan-system.md
      - design/gdd/entity-system.md  # computes this SAME formula locally (Core Rule 4) from shared session:tick/scan:coverage inputs, not a new event
      # Reads coverage from Scan Node System; drives perception-stripping intensity
    variables:
      - t
      - T_session
      - coverage
      - w_t
      - w_c
    output_range: [0, 1]
    expression: "clamp(w_t*(t/T_session) + w_c*coverage, 0, 1)"
    notes: "Single 0-1 escalation dial. coverage is owned by Scan Node System
      (consumed via Orchestrator). Feeds desync_delay. w_t capped at 0.8 (w_c >= 0.2)
      as of 2026-06-30 re-review -- without the cap, w_t=1.0 let e reach 1.0 from
      elapsed time alone, breaking the desync_delay D_max-only-via-trap guarantee."
    added: 2026-06-27
    revised: "2026-06-30"

  - name: coverage
    status: active
    source: design/gdd/scan-node-system.md
    referenced_by:
      - design/gdd/scan-node-system.md
      - design/gdd/floor-plan-system.md  # session_escalation reads coverage as input
      - design/gdd/win-lose-ending.md  # ending record snapshot (Core Rule 8); Escape/Completion Trap trigger evaluation
    variables:
      - V
      - S
    output_range: [0.0, 1.0]
    expression: "coverage = V / S   (V = VALID nodes; S = count(STANDARD) + 1 anomaly node; NULL excluded; S fixed at init)"
    notes: "Single coverage fraction. Denominator includes the ANOMALY_FINAL node
      from init, so escape (all standard, anomaly unscanned) tops out at N/(N+1) <
      1.0; 1.0 reachable only by scanning the anomaly node (Completion Trap §9).
      UI nodesCompleted counter uses a DIFFERENT (standard-only) denominator — do
      not conflate."
    added: 2026-06-27
    revised: ""

  - name: desync_delay
    status: active
    source: design/gdd/floor-plan-system.md
    referenced_by:
      - design/gdd/floor-plan-system.md
      # Governs dollhouse mask lag -> consumed by UI/HUD dollhouse panel
    variables:
      - e
      - D0
      - D_max
    output_range: [0.0, 120.0]  # full safe config envelope; defaults produce 2.0–25.0s, escape ceiling ~22.5s
    expression: "D0 + (D_max - D0) * e^3"  # was e^2; cubic since re-review 2026-06-27 (floor-plan design-review)
    notes: "Seconds the dollhouse lags reality (continuous player-position history +
      discrete scan-state queue). e from session_escalation. CUBIC so map stays truthful
      early, degrades steeply late (perception stripping). D_max is reached only via
      Completion Trap AT ANY LEGAL CONFIG (structurally guaranteed since 2026-06-30 by
      the session_escalation w_t<=0.8 cap -- prior to that the claim only held at
      default weights). D0 < D_max enforced at load since 2026-06-30 (D0=D_max collapses
      the curve to a flat constant). 0-120 is the allowed cross-configuration envelope."
    added: 2026-06-27
    revised: "2026-06-30"

