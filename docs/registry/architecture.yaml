# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_cross_system_import
    status: active
    description: "A gameplay system (src/systems/**) must never import another gameplay
      system directly. All cross-system communication goes through the Orchestrator bus."
    why: "Core Rule 5 of orchestrator.md. Direct imports create the coupling the event
      bus exists to prevent (e.g. Entity <-> Scan Mechanic circular dependency) and make
      systems untestable in isolation. Enforced by eslint import/no-restricted-paths."
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    added: 2026-07-02

  - pattern: module_singleton_bus
    status: active
    description: "The Orchestrator must not be exported/imported as a module-level
      singleton (export const bus = new Orchestrator()). It is constructed once in
      src/main.js and injected by reference."
    why: "coding-standards.md mandates DI over singletons. A singleton bus makes the 34
      AC-OR tests order-dependent (cached latest-value + session state leak across tests)
      and blocks consumers from mocking the bus in their own unit tests."
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    added: 2026-07-02

