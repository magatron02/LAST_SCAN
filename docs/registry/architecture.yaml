# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC             # desktop web browser, WebGL2
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    added: 2026-07-02
    revised: ""

  - system: orchestrator
    status: active
    budget_ms: 0.3
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    notes: "Per-frame event delivery: one queue snapshot + one stable sort + O(1) key lookup per event. Dev perf-tripwire warns at queue length > 64/tick."
    referenced_by:
      - docs/architecture/adr-0001-orchestrator-bus-wiring.md
    added: 2026-07-02
    revised: ""

  - system: ui-hud
    status: active
    budget_ms: 0.1
    adr: docs/architecture/adr-0008-ui-hud.md
    notes: "Per-tick dirty-check: 2 polled view-model getters + structuralEqual() deep-compare over
      small bounded objects (node ledger <=16 entries; dollhouse view model a fixed-shape summary).
      DOM write occurs only on a changed tick. ⚠️ EXTRAPOLATED, NOT PROFILED — same unverified class
      as ADR-0003's anomaly-sweep slice. A per-point or otherwise unbounded view model MUST NOT be
      routed through this compare (ui-hud.md Core Rule 2 cost bound); if one is ever added, this
      budget needs a keyed/versioned dirty-flag instead of a full structural walk."
    referenced_by:
      - docs/architecture/adr-0008-ui-hud.md
      - docs/architecture/adr-0003-per-frame-budget.md   # slice added to its (a) table, closes review conflict C3
    added: 2026-08-01
    revised: ""

