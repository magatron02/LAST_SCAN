# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: bus_wiring
    status: active
    api: manual_composition_root
    not: module_singleton_export / service_locator   # both banned (see forbidden_patterns)
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    reason: "src/main.js constructs the single Orchestrator and injects it via constructor (class modules) or init(bus) (flat modules). No DI library in the allowed list; satisfies coding-standards DI-over-singleton + per-test fresh instance."
    referenced_by:
      - docs/architecture/adr-0001-orchestrator-bus-wiring.md
      - docs/architecture/adr-0008-ui-hud.md   # extends the same composition root to sibling-system references
    added: 2026-07-02
    revised: ""

  - purpose: override_set_storage
    status: active
    api: hand-authored data module (src/core/event-overrides.js)
    not: build_time_codegen_from_entities_yaml   # rejected as premature (no Vite codegen step; set is small)
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    reason: "Rule 4's directed+atomic override set is a JS literal compiled once at Orchestrator construction (module-load). No runtime registerOverride() API; 'extend' = edit literal + reload."
    referenced_by:
      - docs/architecture/adr-0001-orchestrator-bus-wiring.md
    added: 2026-07-02
    revised: ""

  - purpose: cross_system_import_enforcement
    status: active
    api: eslint import/no-restricted-paths (zone rule, CI)
    not: review_checklist_only   # not a forcing function
    adr: docs/architecture/adr-0001-orchestrator-bus-wiring.md
    reason: "Enforces Core Rule 5: src/systems/** may not import a sibling src/systems/**; only src/core/orchestrator.js is a permitted cross-system channel. Concrete zone globs fixed when first system is scaffolded."
    referenced_by:
      - docs/architecture/adr-0001-orchestrator-bus-wiring.md
      - docs/architecture/adr-0008-ui-hud.md   # (a) settles this rule's scope for the presentation layer
    added: 2026-07-02
    revised: ""

  - purpose: presentation_layer_module_placement
    status: active
    api: src/ui/**   # e.g. src/ui/hud.js, src/ui/structural-equal.js, src/ui/message-pool.js
    not: src/systems/ui-hud.js   # rejected — would need an explicit carve-out in the zone rule's globs
    adr: docs/architecture/adr-0008-ui-hud.md
    reason: "Presentation-layer systems live OUTSIDE src/systems/** entirely, so the
      cross_system_import_enforcement zone rule (src/systems/** -> src/systems/**) never reaches
      them by construction rather than by documented exception. UI/HUD makes zero static imports of
      any sibling regardless — every reference arrives via constructor injection from src/main.js.
      Precedent for future presentation-layer systems (Found-Footage Layer #13). NOTE for whoever
      fixes the concrete zone globs (ADR-0001 (c), still open): also ban src/ui/** -> src/systems/**,
      not just the reverse — the DI pattern never needs a static import in either direction."
    referenced_by:
      - docs/architecture/adr-0008-ui-hud.md
    added: 2026-08-01
    revised: ""

