# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 3
last_updated: "2026-08-01"  # /architecture-review — +30 TRs for the 4 MVP systems designed since v2 (Scan Mechanic, Entity, Win/Lose, UI/HUD). None has an owning ADR yet; see architecture-review-2026-08-01.md.

requirements:

  # --- Point Cloud Renderer (design/gdd/point-cloud-renderer.md) ---
  - id: TR-pc-001
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "All player-visible output is THREE.Points; no THREE.Mesh with a visible material is ever rendered to the player camera"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-002
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Additive independent point layers by category (BASE / ENTITY_SPIKE / ENTITY_GHOST / VOID_MASK); layers add to the scene, never replace BASE"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-003
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Type A void rendered as a depth-only invisible occluder mesh blocking BASE points; requires Three.js r171 depthWrite/colorWrite/renderOrder verification (renderer OQ1, HIGH engine risk, unresolved)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-004
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Point budget ceiling (default 1,500,000; max ~2M); density auto-scales uniformly at scene load to fit; BASE rebuild is single-frame with no pop"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-005
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "60 FPS target at the point budget ceiling on minimum-spec desktop (AC-P01: avg >=55 FPS over 300 frames)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-006
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Consume Floor Plan room AABB + surface list via the bus to build/rebuild BASE geometry; renderer owns no spatial data"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-007
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Per-frame BufferGeometry attribute mutation for proximity jitter/corruption on BASE points within entity influence radius"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-008
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Scan materialization overlay: progressive opacity ramp per capture angle, seal into BASE on complete, discard on abort"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-pc-009
    system: point-cloud
    gdd: design/gdd/point-cloud-renderer.md
    requirement: "Emit renderer:anomaly_density {sigma} — magnitude only, no type field and no sign — when a detection tile's Formula 2 sigma crosses the threshold for anomaly_confirm_samples consecutive sweeps"
    created: 2026-07-02
    revised: "2026-08-01"
    status: active

  # --- FPS Movement (design/gdd/fps-movement.md) ---
  - id: TR-mov-001
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "Two-state movement machine: NAVIGATE and SCAN_LOCKED only; no third state"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-002
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "Kinematic WASD locomotion + PointerLock mouse-look; no physics engine, no jump/crouch/sprint, fixed gait and eye height"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-003
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "AABB position clamp against room union-bounds each frame with WALL_MARGIN; dt hard-capped at 0.1s to prevent tab-restore tunnelling"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-004
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "PointerLock lifecycle: requested on first gesture, input pauses on loss but world/entity does not pause, never re-requested during SCAN_LOCKED"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-005
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "Bus integration: publishes player:position {x,y,z} each frame; receives movement:scan_triggered, scan:complete, scan:abort, floorplan:loop"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-006
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "Camera yaw/pitch via camera.rotation under YXZ order; pitch hard-clamped to +/-80deg (avoids gimbal singularity); yaw excludes pitch from movement"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-mov-007
    system: movement
    gdd: design/gdd/fps-movement.md
    requirement: "dt is an injected parameter to the update function (not an internal clock read) so the dt-cap and movement math are unit-testable (AC-EC03)"
    created: 2026-07-02
    revised: ""
    status: active

  # --- Floor Plan System (design/gdd/floor-plan-system.md) ---
  - id: TR-fp-001
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Owns authoritative PropertyLayout data (room AABBs, doors, surfaces, node estimates); selected from curated pool or resolved from seed code"
