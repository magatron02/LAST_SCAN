  - id: TR-fp-002
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Two-contract init: floorplan:init once (complete internal roster incl. hidden metadata, no hidden AABBs) + floorplan:update (renderable geometry only)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-003
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Dollhouse is a derived view produced by filtering the layout through a per-room view-state mask; never exposes ANOMALY rooms, entity position, or true real-time scan state inside the desync window"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-004
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Dollhouse desync: position ring buffer (interpolated at now - desync_delay) + discrete scan-state queue with delay snapshotted at event time"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-005
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Looping geometry: per-door state machine (DORMANT/ARMED/TRIGGERED/COOLDOWN) with threshold-crossing detection; emits floorplan:loop, never mutates base geometry"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-006
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "session_escalation (e) and desync_delay formulas; e consumes scan:coverage and session:tick, cubic desync curve"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-007
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Layout validation at load (door widths >=0.71m, navigability, exactly one ANOMALY_FINAL, >=1 STANDARD, D0<D_max, weight-sum guards); reject+reselect or hard-fail on pool exhaustion"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-008
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Bus integration: emits floorplan:init/update/reveal/loop; consumes player:position, session:tick, scan:*, entity:proximity, session:end"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-fp-009
    system: floor-plan
    gdd: design/gdd/floor-plan-system.md
    requirement: "Supplies the dollhouse view model to UI/HUD (room outlines, labels, estimated nodes, per-room freshness mask); requires a diegetic 'cached data' framing to exist"
    created: 2026-07-02
    revised: ""
    status: active

  # --- Scan Node System (design/gdd/scan-node-system.md) ---
  - id: TR-sn-001
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Authoritative node registry + per-node state machine (UNSCANNED -> SCANNING -> VALID | INVALID; NULL permanent); single source of node truth"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-002
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Builds roster from floorplan:init; adopts authoritative real node positions from per-property session data (data/sessions/) with floor-plan estimate fallback. Position pipeline unspecified (Open Q#4)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-003
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "coverage = V/S where S = count(STANDARD)+1 (ANOMALY_FINAL), NULL excluded; pure function of node states, fixed at init, S invariant under reveal"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-004
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Emits canonical scan:complete/abort/coverage/integrity_* with internal state (status, coverage) updated BEFORE emission, same-tick equality of scan:coverage and scan:complete.coverage (AC-SN29)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-005
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Integrity accumulator (monotonic invalid-capture count) with corruption_threshold single-fire scan:integrity_failure"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-006
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Records per-node entityCaptured and session-level entityEverCaptured from reported entityInFrame; read by Win/Lose for the bad ending"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-007
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "nodesCompleted uses a STANDARD-only denominator (N); coverage uses N+1; the two numbers diverge deliberately and must not be reconciled"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-sn-008
    system: scan-node
    gdd: design/gdd/scan-node-system.md
    requirement: "Supplies node-ledger view model to UI/HUD; coverage must be the visually dominant/trust-bearing number and carry a non-colour channel"
    created: 2026-07-02
    revised: ""
    status: active

  # --- Session/Game State Orchestrator (design/gdd/orchestrator.md) ---
  - id: TR-or-001
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Central pub/sub bus registering the canonical name + payload shape of every cross-system event in entities.yaml; only registered names are valid (verify-registry machine-check)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-002
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Session state machine LOADING -> ACTIVE -> SEALED (sole owner); produces session:tick per frame and session:end once; session:request_end {reason} intake"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-003
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Deterministic per-frame delivery: global FIFO by arrival index + compiled override groups (directed + atomic), resolved as one stable sort on (groupAnchorIndex, intraGroupRank); override set compiled once, no runtime registerOverride"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-004
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Latest-value events cached and replayed on subscribe vs discrete fire-and-forget; subscribe() synchronously reentrant during delivery; at most one delivery per emission per subscriber"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-005
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "session:tick elapsedSeconds is capped-dt game time (each frame delta clamped to dt_cap 0.1s), immune to tab-restore jumps (AC-OR34)"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-006
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Bus wiring: src/main.js is the sole composition root; class modules get bus via constructor, flat modules via init(bus); no module-level singleton"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-007
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Core Rule 5 enforced mechanically: ESLint import/no-restricted-paths forbids any src/systems/** module importing a sibling; bus is the only cross-system channel"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-008
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Full delivery pass runs before renderer.render() within each rAF callback; dev-only perf tripwire warns when a tick's delivered-queue length exceeds PERF_TRIPWIRE_QUEUE_MAX"
    created: 2026-07-02
    revised: ""
    status: active
  - id: TR-or-009
    system: orchestrator
    gdd: design/gdd/orchestrator.md
    requirement: "Static override set stored in src/core/event-overrides.js as a hand-authored literal, compiled once at construction; extended by editing the literal and rebuilding"
    created: 2026-07-02
    revised: ""
    status: active

